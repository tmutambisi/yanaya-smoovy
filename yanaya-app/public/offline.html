<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a2a2c" />
    <title>Yanaya: You're offline</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 24px; box-sizing: border-box; text-align: center;
        background: #00662a; color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      img { width: min(300px, 80vw); height: auto; filter: drop-shadow(7px 8px 0 rgba(154,180,108,.9)); }
      h1 { margin: 8px 0 0; font-size: 22px; }
      p { margin: 0; max-width: 320px; color: rgba(255,255,255,.8); line-height: 1.45; }
      button {
        margin-top: 8px; padding: 14px 28px; border-radius: 999px; border: 4px solid #2a2a2c;
        background: #fff; color: #00662a; font-size: 16px; font-weight: 800; cursor: pointer;
        box-shadow: 0 5px 0 0 #9ab46c;
      }
    </style>
  </head>
  <body>
    <img src="/brand/yanaya-logo.png" alt="Yanaya" />
    <h1>You're offline</h1>
    <p>Check your data or Wi-Fi connection, then try again. Your order details are saved on this phone.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
